<text x="40" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#435866" font-weight="400" text-anchor="start">Neurônio artificial, Turing</text>
<text x="40" y="210" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#007969" font-weight="700" text-anchor="start">Defina a métrica antes</text>
