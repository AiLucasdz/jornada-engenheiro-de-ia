<svg xmlns="http://www.w3.org/2000/svg" width="1162" height="472" viewBox="0 0 1162 472" role="img" aria-labelledby="title desc">
<title id="title">Como a IA chegou até aqui</title>
<desc id="desc">Linha do tempo da IA em oito períodos, alternando euforia e inverno. 1943–1955 · Fundações: Neurônio artificial, Turing. Lição: Defina a métrica antes; 1956–1973 · Euforia: Dartmouth, Perceptron, ELIZA. Lição: Demonstração não é produção; 1974–1980 · 1º inverno: Verba cortada nos EUA e RU. Lição: Promessa maior que a entrega; 1980–1987 · Sistemas especialistas: XCON: US$ 40 mi por ano. Lição: Escopo estreito gera retorno; 1987–1995 · 2º inverno: Regras caras de manter. Lição: Manutenção mata automação; 1995–2011 · Bastidores: Deep Blue, ImageNet. Lição: O gargalo é dado organizado; 2012–2022 · A virada: AlexNet, Transformer, ChatGPT. Lição: A interface fez o sucesso; 2023–hoje · Agentes: Modelos que usam ferramentas. Lição: O gargalo é o processo. Invernos vêm de promessa, não de falha técnica.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#007969"/></marker></defs>
<rect width="1162" height="472" rx="24" fill="#f5f8f7"/>
<text x="24" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#102236" font-weight="700" text-anchor="start">COMO A IA CHEGOU ATÉ AQUI</text>
<text x="24" y="74" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#435866" font-weight="400" text-anchor="start">Euforia e inverno se alternam. As lições se repetem.</text>
