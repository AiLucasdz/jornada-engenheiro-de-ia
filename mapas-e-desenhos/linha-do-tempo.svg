<text x="326" y="154" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#102236" font-weight="700" text-anchor="start">Euforia</text>
<text x="326" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#435866" font-weight="400" text-anchor="start">Dartmouth, Perceptron, ELIZA</text>
<text x="326" y="210" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#007969" font-weight="700" text-anchor="start">Demonstração não é produção</text>
