<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1330" viewBox="0 0 640 1330" role="img" aria-labelledby="title desc">
<title id="title">O modelo é uma peça do sistema agente</title><desc id="desc">Um modelo recebe contexto e gera resposta ou solicitação de ferramenta. O sistema agente reúne contexto, modelo, validação e execução de ferramentas; o resultado pode voltar ao modelo. Hermes oferece uma estrutura para organizar esse ciclo, suas ferramentas, memória e habilidades.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#007969"/></marker><marker id="arrow-coral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#b95432"/></marker></defs>
<rect width="640" height="1330" rx="24" fill="#f5f8f7"/>
<rect x="32" y="30" width="8" height="42" rx="4" fill="#007969" stroke="#007969" stroke-width="2"/>
<text x="54" y="60" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="54" dy="0">AULA 02 · MODELO E SISTEMA</tspan>
</text>
<text x="32" y="115" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="32" dy="0">De modelo a agente</tspan>
</text>
<text x="32" y="158" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="32" dy="0">O modelo é uma peça dentro do sistema.</tspan>
</text>
<rect x="32" y="188" width="576" height="291" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<text x="56" y="231" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="56" dy="0">UMA CHAMADA AO MODELO</tspan>
</text>
<text x="320" y="278" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#102236" text-anchor="middle">
<tspan x="320" dy="0">Entrada + contexto</tspan>
</text>
<path d="M320 296V321" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="182" y="337" width="276" height="71" rx="18" fill="#102236" stroke="#102236" stroke-width="2"/>
<g transform="translate(201,348)" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<rect x="8" y="8" width="36" height="36" rx="9"/><path d="M18 1V8 M34 1V8 M18 44V51 M34 44V51 M1 18H8 M1 34H8 M44 18H51 M44 34H51"/><circle cx="20" cy="23" r="2"/><circle cx="33" cy="23" r="2"/><path d="M18 34H34"/>
</g>
<text x="331" y="381" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle">
<tspan x="331" dy="0">Modelo</tspan>
</text>
<path d="M320 413V438" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="320" y="465" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#102236" text-anchor="middle">
<tspan x="320" dy="0">Resposta ou pedido de ferramenta</tspan>
</text>
<rect x="32" y="515" width="576" height="602" rx="18" fill="#e0f0eb" stroke="#e0f0eb" stroke-width="2"/>
<text x="56" y="559" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="56" dy="0">SISTEMA AGENTE</tspan>
</text>
<rect x="56" y="583" width="496" height="110" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(75,611)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M9 4H32L43 15V48H9Z M32 4V15H43 M17 24H35 M17 33H35 M17 41H28"/>
</g>
<text x="148" y="626" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="148" dy="0">Contexto</tspan>
</text>
<text x="148" y="665" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="148" dy="0">Tarefa, fontes e histórico</tspan>
</text>
<path d="M304 697V718" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="56" y="731" width="496" height="110" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(75,759)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<rect x="8" y="8" width="36" height="36" rx="9"/><path d="M18 1V8 M34 1V8 M18 44V51 M34 44V51 M1 18H8 M1 34H8 M44 18H51 M44 34H51"/><circle cx="20" cy="23" r="2"/><circle cx="33" cy="23" r="2"/><path d="M18 34H34"/>
</g>
<text x="148" y="774" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="148" dy="0">Modelo</tspan>
</text>
<text x="148" y="813" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="148" dy="0">Responde ou pede uma ação</tspan>
</text>
<path d="M304 846V867" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="56" y="880" width="496" height="110" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(75,908)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M36 5A14 14 0 0 0 19 22L5 36A7 7 0 0 0 15 46L30 31A14 14 0 0 0 47 14L38 23L29 14Z"/>
</g>
<text x="148" y="923" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="148" dy="0">Ferramentas</tspan>
</text>
<text x="148" y="962" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="148" dy="0">Sistema valida e executa</tspan>
</text>
<text x="78" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="78" dy="0">O resultado volta ao contexto.</tspan>
</text>
<path d="M562 943H586V640H559" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="78" y="1081" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="78" dy="0">Cada passo tem limites e registro.</tspan>
</text>
<rect x="32" y="1150" width="576" height="143" rx="18" fill="#fff0e9" stroke="#fff0e9" stroke-width="2"/>
<text x="52" y="1186" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="52" dy="0">Hermes oferece essa estrutura:</tspan>
<tspan x="52" dy="35">ciclo, ferramentas, memória</tspan>
<tspan x="52" dy="35">e habilidades reutilizáveis.</tspan>
</text>
</svg>
