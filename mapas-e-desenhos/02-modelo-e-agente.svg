<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">AS PEÇAS DO AGENTE</title><desc id="desc">Hermes reúne o modelo e o sistema ao redor dele. 1 · Contexto: Pedido, regras e fontes. O que está disponível?; 2 · Modelo: Interpreta a tarefa. Responde ou pede ação.; 3 · Ferramenta: Sistema valida o pedido. Executa o permitido.; 4 · Resultado: Dado ou erro observado. Volta ao contexto.. O resultado orienta o próximo passo ou a parada.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00816d"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f5faf8"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="24" y="36" font-size="24" font-weight="750" fill="#183448">AS PEÇAS DO AGENTE</text>
<text x="24" y="64" font-size="18" font-weight="400" fill="#526b7b">Hermes reúne o modelo e o sistema ao redor dele.</text>
<rect x="24" y="88" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="119" font-size="22" font-weight="720" fill="#183448">1 · Contexto</text>
<text x="40" y="153" font-size="21" font-weight="400" fill="#183448">Pedido, regras e fontes.</text>
<text x="40" y="182" font-size="21" font-weight="400" fill="#183448">O que está disponível?</text>
<rect x="344" y="88" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="119" font-size="22" font-weight="720" fill="#183448">2 · Modelo</text>
<text x="360" y="153" font-size="21" font-weight="400" fill="#183448">Interpreta a tarefa.</text>
<text x="360" y="182" font-size="21" font-weight="400" fill="#183448">Responde ou pede ação.</text>
<rect x="24" y="240" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="271" font-size="22" font-weight="720" fill="#183448">3 · Ferramenta</text>
<text x="40" y="305" font-size="21" font-weight="400" fill="#183448">Sistema valida o pedido.</text>
<text x="40" y="334" font-size="21" font-weight="400" fill="#183448">Executa o permitido.</text>
<rect x="344" y="240" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="271" font-size="22" font-weight="720" fill="#183448">4 · Resultado</text>
<text x="360" y="305" font-size="21" font-weight="400" fill="#183448">Dado ou erro observado.</text>
<text x="360" y="334" font-size="21" font-weight="400" fill="#183448">Volta ao contexto.</text>
<g stroke="#00816d" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M 301 148 H 337"/><path d="M 480 211 V 225 H 160 V 233"/><path d="M 301 300 H 337"/></g>
<text x="24" y="397" font-size="18" font-weight="500" fill="#365c55">O resultado orienta o próximo passo ou a parada.</text>
</g></svg>
