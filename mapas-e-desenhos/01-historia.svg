<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">O QUE A HISTÓRIA ENSINA</title><desc id="desc">As abordagens se somam; cada uma tem limites. 1950–1956 · Perguntas: Turing e Dartmouth. Como avaliar a IA?; Anos 1980 · Regras: Sistemas especialistas. Quem mantém as regras?; 2012–2017 · Modelos: AlexNet e Transformer. Quais dados usar?; Aplicações · Agentes: Modelos + ferramentas. Como conferir a ação?. Cada avanço precisa de contexto, testes e manutenção.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00816d"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f5faf8"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="24" y="36" font-size="24" font-weight="750" fill="#183448">O QUE A HISTÓRIA ENSINA</text>
<text x="24" y="64" font-size="18" font-weight="400" fill="#526b7b">As abordagens se somam; cada uma tem limites.</text>
<rect x="24" y="88" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="119" font-size="22" font-weight="720" fill="#183448">1950–1956 · Perguntas</text>
<text x="40" y="153" font-size="21" font-weight="400" fill="#183448">Turing e Dartmouth.</text>
<text x="40" y="182" font-size="21" font-weight="400" fill="#183448">Como avaliar a IA?</text>
<rect x="344" y="88" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="119" font-size="22" font-weight="720" fill="#183448">Anos 1980 · Regras</text>
<text x="360" y="153" font-size="21" font-weight="400" fill="#183448">Sistemas especialistas.</text>
<text x="360" y="182" font-size="21" font-weight="400" fill="#183448">Quem mantém as regras?</text>
<rect x="24" y="240" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="271" font-size="22" font-weight="720" fill="#183448">2012–2017 · Modelos</text>
<text x="40" y="305" font-size="21" font-weight="400" fill="#183448">AlexNet e Transformer.</text>
<text x="40" y="334" font-size="21" font-weight="400" fill="#183448">Quais dados usar?</text>
<rect x="344" y="240" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="271" font-size="22" font-weight="720" fill="#183448">Aplicações · Agentes</text>
<text x="360" y="305" font-size="21" font-weight="400" fill="#183448">Modelos + ferramentas.</text>
<text x="360" y="334" font-size="21" font-weight="400" fill="#183448">Como conferir a ação?</text>
<g stroke="#00816d" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M 301 148 H 337"/><path d="M 480 211 V 225 H 160 V 233"/><path d="M 301 300 H 337"/></g>
<text x="24" y="397" font-size="18" font-weight="500" fill="#365c55">Cada avanço precisa de contexto, testes e manutenção.</text>
