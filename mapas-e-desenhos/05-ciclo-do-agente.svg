<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">DECIDIR → AGIR → CONFERIR</title><desc id="desc">O modelo solicita; o sistema valida e executa. 1 · Definir a tarefa: Pedido + contexto. Objetivo e limites.; 2 · Escolher o passo: Responder ou usar uma ferramenta.; 3 · Executar: Confira dados e acesso. Faça a ação permitida.; 4 · Observar: Retorne o resultado. Continuar ou parar?. Pare ao concluir, faltar dado ou atingir um limite.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00816d"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f5faf8"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="24" y="36" font-size="24" font-weight="750" fill="#183448">DECIDIR → AGIR → CONFERIR</text>
<text x="24" y="64" font-size="18" font-weight="400" fill="#526b7b">O modelo solicita; o sistema valida e executa.</text>
<rect x="24" y="88" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="119" font-size="22" font-weight="720" fill="#183448">1 · Definir a tarefa</text>
<text x="40" y="153" font-size="21" font-weight="400" fill="#183448">Pedido + contexto.</text>
<text x="40" y="182" font-size="21" font-weight="400" fill="#183448">Objetivo e limites.</text>
<rect x="344" y="88" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="119" font-size="22" font-weight="720" fill="#183448">2 · Escolher o passo</text>
<text x="360" y="153" font-size="21" font-weight="400" fill="#183448">Responder ou usar</text>
<text x="360" y="182" font-size="21" font-weight="400" fill="#183448">uma ferramenta.</text>
<rect x="24" y="240" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="271" font-size="22" font-weight="720" fill="#183448">3 · Executar</text>
<text x="40" y="305" font-size="21" font-weight="400" fill="#183448">Confira dados e acesso.</text>
<text x="40" y="334" font-size="21" font-weight="400" fill="#183448">Faça a ação permitida.</text>
<rect x="344" y="240" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="271" font-size="22" font-weight="720" fill="#183448">4 · Observar</text>
<text x="360" y="305" font-size="21" font-weight="400" fill="#183448">Retorne o resultado.</text>
<text x="360" y="334" font-size="21" font-weight="400" fill="#183448">Continuar ou parar?</text>
<g stroke="#00816d" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M 301 148 H 337"/><path d="M 480 211 V 225 H 160 V 233"/><path d="M 301 300 H 337"/></g>
<text x="24" y="397" font-size="18" font-weight="500" fill="#365c55">Pare ao concluir, faltar dado ou atingir um limite.</text>
</g></svg>
