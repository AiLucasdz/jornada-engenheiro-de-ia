<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">O CAMINHO DO PEDIDO</title><desc id="desc">Acompanhe a informação antes de automatizar. 1 · Receber: Mensagem de orçamento. Guarde origem e ID.; 2 · Conferir: Formato e acesso. Qual campo falta?; 3 · Registrar: Dados e estado atual. Evite registro duplicado.; 4 · Acompanhar: O que mudou e por quê? Guarde também a falha.. Uma integração liga os sistemas e deixa um resultado.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00816d"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f5faf8"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="24" y="36" font-size="24" font-weight="750" fill="#183448">O CAMINHO DO PEDIDO</text>
<text x="24" y="64" font-size="18" font-weight="400" fill="#526b7b">Acompanhe a informação antes de automatizar.</text>
<rect x="24" y="88" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="119" font-size="22" font-weight="720" fill="#183448">1 · Receber</text>
<text x="40" y="153" font-size="21" font-weight="400" fill="#183448">Mensagem de orçamento.</text>
<text x="40" y="182" font-size="21" font-weight="400" fill="#183448">Guarde origem e ID.</text>
<rect x="344" y="88" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="119" font-size="22" font-weight="720" fill="#183448">2 · Conferir</text>
<text x="360" y="153" font-size="21" font-weight="400" fill="#183448">Formato e acesso.</text>
<text x="360" y="182" font-size="21" font-weight="400" fill="#183448">Qual campo falta?</text>
<rect x="24" y="240" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="271" font-size="22" font-weight="720" fill="#183448">3 · Registrar</text>
<text x="40" y="305" font-size="21" font-weight="400" fill="#183448">Dados e estado atual.</text>
<text x="40" y="334" font-size="21" font-weight="400" fill="#183448">Evite registro duplicado.</text>
<rect x="344" y="240" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="271" font-size="22" font-weight="720" fill="#183448">4 · Acompanhar</text>
<text x="360" y="305" font-size="21" font-weight="400" fill="#183448">O que mudou e por quê?</text>
<text x="360" y="334" font-size="21" font-weight="400" fill="#183448">Guarde também a falha.</text>
<g stroke="#00816d" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M 301 148 H 337"/><path d="M 480 211 V 225 H 160 V 233"/><path d="M 301 300 H 337"/></g>
<text x="24" y="397" font-size="18" font-weight="500" fill="#365c55">Uma integração liga os sistemas e deixa um resultado.</text>
</g></svg>
