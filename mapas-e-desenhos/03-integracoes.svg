<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1220" viewBox="0 0 640 1220" role="img" aria-labelledby="title desc">
<title id="title">Da entrada ao histórico: uma integração verificável</title><desc id="desc">A entrada é validada, registrada e usada em uma consulta ou ação autorizada; o resultado é incluído no histórico. Falhas de validação ou execução seguem tratamento explícito, com erro registrado, pedido de correção ou repetição limitada.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#007969"/></marker><marker id="arrow-coral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#b95432"/></marker></defs>
<rect width="640" height="1220" rx="24" fill="#f5f8f7"/>
