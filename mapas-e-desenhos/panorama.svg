<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc">
<title id="title">Um agente, quatro entregas práticas</title><desc id="desc">Comece com Hermes e uma tarefa pequena, acrescente contexto e fontes, conecte uma ação e teste, melhore e demonstre o resultado. Sete aulas oferecem apoio quando necessário. A rotina combina 80% de prática com 20% de estudo, sem prazo obrigatório.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#007969"/></marker><marker id="arrow-coral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#b95432"/></marker></defs>
<rect width="640" height="1510" rx="24" fill="#f5f8f7"/>
<rect x="32" y="30" width="8" height="42" rx="4" fill="#007969" stroke="#007969" stroke-width="2"/>
<text x="54" y="60" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="54" dy="0">JORNADA DO ENGENHEIRO DE IA</tspan>
</text>
<text x="32" y="115" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="32" dy="0">Um agente, quatro entregas</tspan>
</text>
<text x="32" y="158" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="32" dy="0">Aprenda enquanto melhora o seu agente.</tspan>
</text>
<rect x="32" y="190" width="576" height="109" rx="18" fill="#102236" stroke="#102236" stroke-width="2"/>
<g transform="translate(54,217)" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M9 49V4 M10 6H44L35 18L44 29H10"/>
</g>
<text x="124" y="233" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="start">
<tspan x="124" dy="0">SEU PROJETO</tspan>
</text>
<text x="124" y="272" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="white" text-anchor="start">
<tspan x="124" dy="0">Um agente para uma tarefa real</tspan>
</text>
<rect x="32" y="338" width="576" height="185" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="66" cy="381" r="23" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="66" y="391" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#007969" text-anchor="middle">
<tspan x="66" dy="0">01</tspan>
</text>
<text x="102" y="390" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="102" dy="0">Começar com Hermes</tspan>
</text>
<text x="56" y="446" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="56" dy="0">Escolha uma tarefa pequena.</tspan>
<tspan x="56" dy="39">Execute e observe o resultado.</tspan>
</text>
<path d="M320 528V552" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="560" width="576" height="185" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="66" cy="603" r="23" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="66" y="613" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#007969" text-anchor="middle">
<tspan x="66" dy="0">02</tspan>
</text>
<text x="102" y="612" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="102" dy="0">Dar contexto e fontes</tspan>
</text>
<text x="56" y="668" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="56" dy="0">Forneça informação útil.</tspan>
<tspan x="56" dy="39">Confira de onde veio a resposta.</tspan>
</text>
<path d="M320 750V774" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="782" width="576" height="185" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="66" cy="825" r="23" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="66" y="835" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#007969" text-anchor="middle">
<tspan x="66" dy="0">03</tspan>
</text>
<text x="102" y="834" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="102" dy="0">Conectar uma ação</tspan>
</text>
<text x="56" y="890" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="56" dy="0">Escolha uma ferramenta.</tspan>
<tspan x="56" dy="39">Defina o que ela pode fazer.</tspan>
</text>
<path d="M320 972V996" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="1004" width="576" height="185" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="66" cy="1047" r="23" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="66" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#007969" text-anchor="middle">
<tspan x="66" dy="0">04</tspan>
</text>
<text x="102" y="1056" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="102" dy="0">Testar e demonstrar</tspan>
</text>
<text x="56" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="56" dy="0">Encontre uma falha e melhore.</tspan>
<tspan x="56" dy="39">Mostre o agente funcionando.</tspan>
</text>
<rect x="32" y="1222" width="576" height="108" rx="18" fill="#e0f0eb" stroke="#e0f0eb" stroke-width="2"/>
<text x="52" y="1258" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="52" dy="0">7 aulas de apoio, quando precisar.</tspan>
<tspan x="52" dy="35">Fontes → prática → resultado registrado.</tspan>
</text>
<rect x="32" y="1350" width="460" height="57" rx="10" fill="#007969" stroke="#007969" stroke-width="2"/>
<rect x="492" y="1350" width="116" height="57" rx="10" fill="#f39c7b" stroke="#f39c7b" stroke-width="2"/>
<text x="262" y="1388" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle">
<tspan x="262" dy="0">80% prática</tspan>
</text>
<text x="550" y="1388" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#102236" text-anchor="middle">
<tspan x="550" dy="0">20%</tspan>
</text>
<text x="32" y="1454" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="32" dy="0">20% estudo para orientar o próximo passo.</tspan>
</text>
</svg>
