<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">UM PROJETO · QUATRO ENTREGAS</title><desc id="desc">Pedidos de orçamento, do teste à demonstração. 1 · Entender o pedido: Leia a mensagem. Identifique o que falta.; 2 · Consultar a fonte: Use o catálogo aprovado. Mostre de onde veio.; 3 · Registrar o pedido: Preencha a tabela. Confira o que foi salvo.; 4 · Testar e mostrar: Corrija uma falha. Demonstre a melhoria.. Avance pelo resultado que consegue demonstrar.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00816d"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f5faf8"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="24" y="36" font-size="24" font-weight="750" fill="#183448">UM PROJETO · QUATRO ENTREGAS</text>
<text x="24" y="64" font-size="18" font-weight="400" fill="#526b7b">Pedidos de orçamento, do teste à demonstração.</text>
<rect x="24" y="88" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="119" font-size="22" font-weight="720" fill="#183448">1 · Entender o pedido</text>
<text x="40" y="153" font-size="21" font-weight="400" fill="#183448">Leia a mensagem.</text>
<text x="40" y="182" font-size="21" font-weight="400" fill="#183448">Identifique o que falta.</text>
<rect x="344" y="88" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="119" font-size="22" font-weight="720" fill="#183448">2 · Consultar a fonte</text>
<text x="360" y="153" font-size="21" font-weight="400" fill="#183448">Use o catálogo aprovado.</text>
<text x="360" y="182" font-size="21" font-weight="400" fill="#183448">Mostre de onde veio.</text>
<rect x="24" y="240" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="271" font-size="22" font-weight="720" fill="#183448">3 · Registrar o pedido</text>
<text x="40" y="305" font-size="21" font-weight="400" fill="#183448">Preencha a tabela.</text>
<text x="40" y="334" font-size="21" font-weight="400" fill="#183448">Confira o que foi salvo.</text>
<rect x="344" y="240" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="271" font-size="22" font-weight="720" fill="#183448">4 · Testar e mostrar</text>
<text x="360" y="305" font-size="21" font-weight="400" fill="#183448">Corrija uma falha.</text>
<text x="360" y="334" font-size="21" font-weight="400" fill="#183448">Demonstre a melhoria.</text>
<g stroke="#00816d" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M 301 148 H 337"/><path d="M 480 211 V 225 H 160 V 233"/><path d="M 301 300 H 337"/></g>
<text x="24" y="397" font-size="18" font-weight="500" fill="#365c55">Avance pelo resultado que consegue demonstrar.</text>
</g></svg>
