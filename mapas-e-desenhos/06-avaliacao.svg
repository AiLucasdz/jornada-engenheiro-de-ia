<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">COMO SABER SE MELHOROU</title><desc id="desc">Compare versões usando os mesmos casos. 1 · Definir o esperado: Escolha os pedidos. O que deve acontecer?; 2 · Executar e comparar: Guarde o resultado. Onde houve diferença?; 3 · Encontrar a causa: Fonte, pedido ou ação? Mude uma coisa.; 4 · Repetir os casos: A falha foi corrigida? Outro caso piorou?. Compare qualidade, tempo e custo nas mesmas condições.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00816d"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f5faf8"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="24" y="36" font-size="24" font-weight="750" fill="#183448">COMO SABER SE MELHOROU</text>
<text x="24" y="64" font-size="18" font-weight="400" fill="#526b7b">Compare versões usando os mesmos casos.</text>
<rect x="24" y="88" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="119" font-size="22" font-weight="720" fill="#183448">1 · Definir o esperado</text>
<text x="40" y="153" font-size="21" font-weight="400" fill="#183448">Escolha os pedidos.</text>
<text x="40" y="182" font-size="21" font-weight="400" fill="#183448">O que deve acontecer?</text>
<rect x="344" y="88" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="119" font-size="22" font-weight="720" fill="#183448">2 · Executar e comparar</text>
<text x="360" y="153" font-size="21" font-weight="400" fill="#183448">Guarde o resultado.</text>
<text x="360" y="182" font-size="21" font-weight="400" fill="#183448">Onde houve diferença?</text>
<rect x="24" y="240" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="271" font-size="22" font-weight="720" fill="#183448">3 · Encontrar a causa</text>
<text x="40" y="305" font-size="21" font-weight="400" fill="#183448">Fonte, pedido ou ação?</text>
<text x="40" y="334" font-size="21" font-weight="400" fill="#183448">Mude uma coisa.</text>
<rect x="344" y="240" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="271" font-size="22" font-weight="720" fill="#183448">4 · Repetir os casos</text>
<text x="360" y="305" font-size="21" font-weight="400" fill="#183448">A falha foi corrigida?</text>
<text x="360" y="334" font-size="21" font-weight="400" fill="#183448">Outro caso piorou?</text>
<g stroke="#00816d" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M 301 148 H 337"/><path d="M 480 211 V 225 H 160 V 233"/><path d="M 301 300 H 337"/></g>
<text x="24" y="397" font-size="18" font-weight="500" fill="#365c55">Compare qualidade, tempo e custo nas mesmas condições.</text>
</g></svg>
