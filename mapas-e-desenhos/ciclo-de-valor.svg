<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Do aprendizado à entrega de valor</title><desc id="desc">O ciclo conecta mentalidade de IA, teoria, prática, comunidade, build in public e entrega de valor. Resultados e conversas ampliam o repertório e revelam o próximo desafio profissional.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#007969"/></marker></defs><rect width="960" height="560" rx="24" fill="#f5f8f7"/>
<text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="40" dy="0">DO APRENDIZADO À ENTREGA DE VALOR</tspan>
</text>
<text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="40" dy="0">Seis movimentos que se alimentam. Um projeto real para aprender.</tspan>
</text>
<path d="M309 181H339" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
