<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Do aprendizado à entrega de valor</title><desc id="desc">O ciclo conecta mentalidade, teoria, prática, comunidade, build in public e oferta. A oferta depende de resultado comprovado e cliente interessado; publicar não gera renda automaticamente. Um piloto entrega valor e seu feedback revela a próxima dor.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#007969"/></marker></defs><rect width="960" height="560" rx="24" fill="#f5f8f7"/>
<text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="40" dy="0">DO APRENDIZADO À ENTREGA DE VALOR</tspan>
</text>
<text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="40" dy="0">Seis movimentos que se alimentam. Um projeto real para aprender.</tspan>
</text>
<path d="M309 181H339" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M616 181H646" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M787 252V282" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M651 366H621" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M344 366H314" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="110" width="266" height="140" rx="20" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="68" cy="143" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="68" y="151" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="68" dy="0">1</tspan>
</text>
<text x="94" y="152" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="94" dy="0">Mentalidade</tspan>
</text>
<text x="60" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">Enxergue uma dor real.</tspan>
<tspan x="60" dy="27">Defina o que mudar.</tspan>
</text>
<rect x="347" y="110" width="266" height="140" rx="20" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="375" cy="143" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="375" y="151" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="375" dy="0">2</tspan>
</text>
<text x="401" y="152" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="401" dy="0">Teoria</tspan>
</text>
<text x="367" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="367" dy="0">Aprenda para destravar</tspan>
<tspan x="367" dy="27">o próximo passo.</tspan>
</text>
<rect x="654" y="110" width="266" height="140" rx="20" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="682" cy="143" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="682" y="151" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="682" dy="0">3</tspan>
</text>
<text x="708" y="152" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="708" dy="0">Prática</tspan>
</text>
<text x="674" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="674" dy="0">Construa, teste e registre</tspan>
<tspan x="674" dy="27">o que funcionou.</tspan>
</text>
<rect x="654" y="292" width="266" height="161" rx="20" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="682" cy="325" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="682" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="682" dy="0">4</tspan>
</text>
<text x="708" y="334" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="708" dy="0">Comunidade</tspan>
</text>
<text x="674" y="374" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="674" dy="0">Troque experiências.</tspan>
<tspan x="674" dy="27">Peça revisão e compare.</tspan>
</text>
<rect x="347" y="292" width="266" height="161" rx="20" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="375" cy="325" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="375" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="375" dy="0">5</tspan>
</text>
<text x="401" y="334" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="401" dy="0">Build in public</tspan>
</text>
<text x="367" y="374" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="367" dy="0">Mostre o processo</tspan>
<tspan x="367" dy="27">e o resultado observado.</tspan>
</text>
<rect x="40" y="292" width="266" height="161" rx="20" fill="#fff0e9" stroke="#fff0e9" stroke-width="2"/>
<circle cx="68" cy="325" r="16" fill="#f39c7b" stroke="none" stroke-width="3"/>
<text x="68" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="68" dy="0">6</tspan>
</text>
<text x="94" y="334" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="94" dy="0">Oferta e entrega</tspan>
</text>
<text x="60" y="374" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">Resultado comprovado</tspan>
<tspan x="60" dy="27">+ cliente interessado</tspan>
<tspan x="60" dy="27">→ Proponha um piloto.</tspan>
</text>
<path d="M173 456V493H18V181H31" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<text x="208" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007969" font-weight="700" text-anchor="start">
<tspan x="208" dy="0">Uso e feedback revelam a próxima dor.</tspan>
</text>
<text x="40" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#102236" font-weight="400" text-anchor="start">
<tspan x="40" dy="0">Ganhar dinheiro exige valor entregue e alguém disposto a pagar por ele.</tspan>
</text>
</svg>
