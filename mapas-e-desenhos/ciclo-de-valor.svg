</text>
<text x="708" y="334" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="708" dy="0">Comunidade</tspan>
</text>
<text x="674" y="374" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="674" dy="0">Acompanhe quem cria.</tspan>
<tspan x="674" dy="27">Troque e experimente.</tspan>
</text>
<rect x="347" y="292" width="266" height="161" rx="20" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<circle cx="375" cy="325" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="375" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="375" dy="0">5</tspan>
</text>
<text x="401" y="334" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="401" dy="0">Build in public</tspan>
</text>
<text x="367" y="374" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="367" dy="0">Veja a construção.</tspan>
<tspan x="367" dy="27">Mostre seu progresso.</tspan>
</text>
<rect x="40" y="292" width="266" height="161" rx="20" fill="#fff0e9" stroke="#fff0e9" stroke-width="2"/>
<circle cx="68" cy="325" r="16" fill="#f39c7b" stroke="none" stroke-width="3"/>
<text x="68" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="68" dy="0">6</tspan>
</text>
<text x="94" y="334" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="94" dy="0">Valor e entrega</tspan>
</text>
<text x="60" y="374" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">Resolva um problema.</tspan>
<tspan x="60" dy="27">Demonstre a melhoria.</tspan>
<tspan x="60" dy="27">Abra uma oportunidade.</tspan>
</text>
<path d="M173 456V493H18V181H31" stroke="#007969" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<text x="208" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#007969" font-weight="700" text-anchor="start">
<tspan x="208" dy="0">Resultados revelam o próximo desafio.</tspan>
</text>
<text x="40" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#102236" font-weight="400" text-anchor="start">
<tspan x="40" dy="0">O que você aprende se transforma no que consegue entregar.</tspan>
</text>
</svg>
