</text>
<text x="60" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">Enxergue possibilidades.</tspan>
<tspan x="60" dy="27">Encontre um problema.</tspan>
</text>
