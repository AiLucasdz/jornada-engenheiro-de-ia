<circle cx="682" cy="325" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="682" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
