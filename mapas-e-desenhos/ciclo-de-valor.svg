<circle cx="375" cy="143" r="16" fill="#e0f0eb" stroke="none" stroke-width="3"/>
<text x="375" y="151" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#007969" font-weight="700" text-anchor="middle">
<tspan x="375" dy="0">2</tspan>
</text>
<text x="401" y="152" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102236" font-weight="700" text-anchor="start">
<tspan x="401" dy="0">Teoria</tspan>
</text>
<text x="367" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#435866" font-weight="400" text-anchor="start">
<tspan x="367" dy="0">Aprenda para destravar</tspan>
<tspan x="367" dy="27">o próximo passo.</tspan>
</text>
