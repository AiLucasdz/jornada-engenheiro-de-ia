<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1550" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc">
<title id="title">RAG: preparar fontes e recuperar contexto para a resposta</title><desc id="desc">A preparação transforma fontes autorizadas em trechos indexados. Na consulta, a pergunta orienta uma busca no índice; os trechos recuperados são enviados ao modelo, que gera uma resposta com fonte. Recuperar contexto não altera os pesos do modelo.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#007969"/></marker><marker id="arrow-coral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#b95432"/></marker></defs>
<rect width="640" height="1550" rx="24" fill="#f5f8f7"/>
<rect x="32" y="30" width="8" height="42" rx="4" fill="#007969" stroke="#007969" stroke-width="2"/>
<text x="54" y="60" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="54" dy="0">AULA 04 · CONTEXTO E RAG</tspan>
</text>
<text x="32" y="115" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="32" dy="0">A resposta tem um caminho</tspan>
</text>
<text x="32" y="158" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="32" dy="0">Prepare a base; depois consulte os trechos.</tspan>
</text>
<rect x="32" y="190" width="576" height="400" rx="18" fill="#e0f0eb" stroke="#e0f0eb" stroke-width="2"/>
<text x="56" y="234" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="56" dy="0">1 · PREPARAR A BASE</tspan>
</text>
<rect x="52" y="256" width="536" height="95" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,284)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M9 4H32L43 15V48H9Z M32 4V15H43 M17 24H35 M17 33H35 M17 41H28"/>
</g>
<text x="144" y="299" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Fontes autorizadas</tspan>
</text>
<text x="144" y="338" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">Documentos e versões</tspan>
</text>
<path d="M320 354V362" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="367" width="536" height="95" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,395)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M9 4H32L43 15V48H9Z M32 4V15H43 M17 24H35 M17 33H35 M17 41H28"/>
</g>
<text x="144" y="410" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Trechos (chunks)</tspan>
</text>
<text x="144" y="449" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">Recortes com significado</tspan>
</text>
<path d="M320 465V473" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="478" width="536" height="95" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,506)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<ellipse cx="26" cy="10" rx="20" ry="7"/><path d="M6 10V42C6 51 46 51 46 42V10 M6 26C6 35 46 35 46 26"/>
</g>
<text x="144" y="521" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Índice de busca</tspan>
</text>
<text x="144" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">Trechos + representações</tspan>
</text>
<rect x="32" y="628" width="576" height="735" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<text x="56" y="673" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#007969" text-anchor="start">
<tspan x="56" dy="0">2 · RESPONDER À PERGUNTA</tspan>
</text>
<rect x="52" y="700" width="536" height="103" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,728)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M7 6H46V36H23L12 47V36H7Z M16 16H37 M16 26H31"/>
</g>
<text x="144" y="743" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Pergunta</tspan>
</text>
<text x="144" y="782" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">O que preciso saber?</tspan>
</text>
<path d="M320 808V823" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="830" width="536" height="103" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,858)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<circle cx="22" cy="22" r="15"/><path d="M33 33L47 47"/>
</g>
<text x="144" y="873" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Busca</tspan>
</text>
<text x="144" y="912" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">Consulta o índice</tspan>
</text>
<path d="M320 938V953" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="960" width="536" height="103" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,988)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M9 4H32L43 15V48H9Z M32 4V15H43 M17 24H35 M17 33H35 M17 41H28"/>
</g>
<text x="144" y="1003" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Trechos relevantes</tspan>
</text>
<text x="144" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">Contexto com origem</tspan>
</text>
<path d="M320 1068V1083" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="1090" width="536" height="103" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,1118)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<rect x="8" y="8" width="36" height="36" rx="9"/><path d="M18 1V8 M34 1V8 M18 44V51 M34 44V51 M1 18H8 M1 34H8 M44 18H51 M44 34H51"/><circle cx="20" cy="23" r="2"/><circle cx="33" cy="23" r="2"/><path d="M18 34H34"/>
</g>
<text x="144" y="1133" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Modelo</tspan>
</text>
<text x="144" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">Usa a pergunta e os trechos</tspan>
</text>
<path d="M320 1198V1213" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="1220" width="536" height="103" rx="18" fill="white" stroke="#c8d9d5" stroke-width="2"/>
<g transform="translate(71,1248)" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
<rect x="5" y="5" width="43" height="43" rx="10"/><path d="M14 27L23 36L40 18"/>
</g>
<text x="144" y="1263" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102236" text-anchor="start">
<tspan x="144" dy="0">Resposta com fonte</tspan>
</text>
<text x="144" y="1302" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#435866" text-anchor="start">
<tspan x="144" dy="0">Referência que dá para conferir</tspan>
</text>
<path d="M592 524H616V882H595" fill="none" stroke="#007969" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="1395" width="576" height="108" rx="18" fill="#fff0e9" stroke="#fff0e9" stroke-width="2"/>
<text x="52" y="1431" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102236" text-anchor="start">
<tspan x="52" dy="0">Sem fonte suficiente, sinalize a falta.</tspan>
<tspan x="52" dy="35">RAG traz contexto; não retreina o modelo.</tspan>
</text>
</svg>
