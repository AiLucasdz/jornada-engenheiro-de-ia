<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">DA FONTE À RESPOSTA</title><desc id="desc">RAG: buscar informação para responder com contexto. 1 · Preparar a base: Catálogo e versão. Trechos para consultar.; 2 · Buscar: Receba a pergunta. Localize o trecho útil.; 3 · Responder: Modelo usa os trechos. Indique a origem.; 4 · Conferir: Compare com a fonte. Não achou? Informe.. Atualize a base quando o catálogo mudar. RAG não retreina.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00816d"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f5faf8"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="24" y="36" font-size="24" font-weight="750" fill="#183448">DA FONTE À RESPOSTA</text>
<text x="24" y="64" font-size="18" font-weight="400" fill="#526b7b">RAG: buscar informação para responder com contexto.</text>
<rect x="24" y="88" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="119" font-size="22" font-weight="720" fill="#183448">1 · Preparar a base</text>
<text x="40" y="153" font-size="21" font-weight="400" fill="#183448">Catálogo e versão.</text>
<text x="40" y="182" font-size="21" font-weight="400" fill="#183448">Trechos para consultar.</text>
<rect x="344" y="88" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="119" font-size="22" font-weight="720" fill="#183448">2 · Buscar</text>
<text x="360" y="153" font-size="21" font-weight="400" fill="#183448">Receba a pergunta.</text>
<text x="360" y="182" font-size="21" font-weight="400" fill="#183448">Localize o trecho útil.</text>
<rect x="24" y="240" width="272" height="120" rx="12" fill="#ffffff" stroke="#ccdfd8"/>
<text x="40" y="271" font-size="22" font-weight="720" fill="#183448">3 · Responder</text>
<text x="40" y="305" font-size="21" font-weight="400" fill="#183448">Modelo usa os trechos.</text>
<text x="40" y="334" font-size="21" font-weight="400" fill="#183448">Indique a origem.</text>
<rect x="344" y="240" width="272" height="120" rx="12" fill="#e5f5ef" stroke="#ccdfd8"/>
<text x="360" y="271" font-size="22" font-weight="720" fill="#183448">4 · Conferir</text>
<text x="360" y="305" font-size="21" font-weight="400" fill="#183448">Compare com a fonte.</text>
<text x="360" y="334" font-size="21" font-weight="400" fill="#183448">Não achou? Informe.</text>
<g stroke="#00816d" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M 301 148 H 337"/><path d="M 480 211 V 225 H 160 V 233"/><path d="M 301 300 H 337"/></g>
<text x="24" y="397" font-size="18" font-weight="500" fill="#365c55">Atualize a base quando o catálogo mudar. RAG não retreina.</text>
</g></svg>
